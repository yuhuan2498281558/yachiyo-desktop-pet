name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and package smoke check
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build unpacked Windows application
        if: github.event_name != 'pull_request'
        run: npm run build:unpacked

      - name: Verify unpacked executable
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -LiteralPath 'release\win-unpacked' -Filter '*.exe' -File)
          if ($executables.Count -eq 0) {
            throw 'No executable was produced in release\win-unpacked.'
          }
          $executables | Select-Object Name, Length
